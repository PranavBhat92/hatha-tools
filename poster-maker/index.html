<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Poster Maker</title>
<style>
:root{--bg:#f7f1e8;--card:#fffaf3;--ink:#2b1a0e;--muted:#7a6553;--line:#e3d5c3;--accent:#8a4f1e;--accent-ink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#1d140d;--card:#2a1d13;--ink:#f6ead9;--muted:#bba78f;--line:#4a3725;--accent:#e0a35a;--accent-ink:#1d140d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:12px 16px 40px;display:grid;gap:16px}
@media (min-width:860px){.wrap{grid-template-columns:minmax(0,1fr) 420px;align-items:start}.preview{position:sticky;top:12px}}
h1.app{font-size:19px;margin:4px 0 0}
.preview canvas{width:100%;height:auto;display:block;border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.25);touch-action:none;cursor:grab}
.hint{font-size:13px;color:var(--muted);margin:6px 2px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:12px}
.card h2{font-size:15px;margin:0;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
label{display:grid;gap:4px;font-size:14px;color:var(--muted)}
input[type=text],input[type=tel]{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prog .row{grid-template-columns:2fr 3fr}
@media (max-width:480px){.prog .row{grid-template-columns:1fr}}
.prog{border:1px dashed var(--line);border-radius:10px;padding:10px;display:grid;gap:10px}
.prog .head{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
button,.btn{font:inherit;font-size:16px;border-radius:10px;border:1px solid var(--accent);background:transparent;color:var(--accent);padding:11px 14px;cursor:pointer;text-align:center}
button.primary{background:var(--accent);color:var(--accent-ink);font-weight:600}
button.link{border:none;padding:4px 6px;font-size:14px}
.actions{display:flex;gap:10px}
.actions button{flex:1}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
details summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:15px}
details[open] summary{margin-bottom:12px}
.small{font-size:13px;color:var(--muted)}
[hidden]{display:none!important}
</style>
</head><body>
<div class="wrap">
  <div class="preview">
    <h1 class="app">Hatha Yoga Poster Maker</h1>
    <canvas id="cv" width="1280" height="1600" style="margin-top:10px"></canvas>
    <p class="hint">Tip: drag the photo on the poster to move it.</p>
  </div>

  <div style="display:grid;gap:14px">
    <div class="card">
      <h2>Program</h2>
      <div id="progs" style="display:grid;gap:10px"></div>
      <button id="addProg" type="button">+ Add another program</button>
    </div>

    <div class="card">
      <h2>Photo</h2>
      <label class="btn file">Choose photo<input id="file" type="file" accept="image/*"></label>
      <label>Zoom <input id="zoom" type="range" min="80" max="250" value="100"></label>
      <label>Move up / down <input id="py" type="range" min="0" max="100" value="50"></label>
      <label>Move left / right <input id="px" type="range" min="0" max="100" value="50"></label>
      <button id="resetPhoto" type="button" class="link" style="justify-self:start">Reset to auto-fit</button>
    </div>

    <div class="card">
      <details id="more">
        <summary>Contact &amp; venue</summary>
        <div style="display:grid;gap:12px">
          <div class="row">
            <label>Name <input id="who" type="text"></label>
            <label>Phone <input id="num" type="tel"></label>
          </div>
          <label>Venue <input id="venue" type="text"></label>
          <p class="small">Long venue names shrink to fit, then wrap onto two lines.</p>
          <button id="resetContact" type="button" class="link" style="justify-self:start">Restore Praarambha details</button>
        </div>
      </details>
    </div>

    <div class="actions">
      <button id="share" type="button" class="primary" hidden>Share</button>
      <button id="dl" type="button" class="primary">Download PNG</button>
    </div>
    <p class="small" style="margin:0">Saves a 1280 × 1600 PNG, ready for WhatsApp or Instagram status.</p>
  </div>
</div>

const DEF={who:"Pranav",num:"95357 97618",venue:"Praarambha Hatha Yoga Center, Rajarajeshwari Nagar, Mysuru",
  progs:[{name:"Angamardana",dates:"27-30 Oct",time:"6:30 AM to 9:30 AM"}]};
const W=1280,H=1600,BAND=1372,MAXP=3;
const H1=78,TAGW=360,TAGTOP=62;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const S={...structuredClone(DEF),zoom:100,px:50,py:50};
let photo=null,tag=null,ready=false;

function load(){try{const s=JSON.parse(localStorage.getItem('poster-maker')||'{}');
  for(const k of['who','num','venue'])if(typeof s[k]==='string')S[k]=s[k];
  if(Array.isArray(s.progs)&&s.progs.length)S.progs=s.progs.slice(0,MAXP);}catch(e){}}
function save(){try{localStorage.setItem('poster-maker',JSON.stringify({who:S.who,num:S.num,venue:S.venue,progs:S.progs}))}catch(e){}}

function b64buf(b){const s=atob(b),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a.buffer}
function img(src){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=src})}

async function init(){
  load();
  const specs=[['r','400','normal'],['i','400','italic'],['b','700','normal'],['bi','700','italic']];
  await Promise.all(specs.map(async([k,w,st])=>{const f=new FontFace('MW',b64buf(FONTS[k]),{weight:w,style:st});await f.load();document.fonts.add(f)}));
  [tag,photo]=await Promise.all([img('data:image/png;base64,'+TAG),img('data:image/jpeg;base64,'+SAMPLE)]);
  ready=true;buildForm();draw();
}

/* ---------- form ---------- */
function buildForm(){
  const box=$('progs');box.innerHTML='';
  S.progs.forEach((p,i)=>{
    const d=document.createElement('div');d.className='prog';
    d.innerHTML=`${S.progs.length>1?`<div class="head"><span>Program ${i+1}</span><button type="button" class="link" data-rm="${i}">Remove</button></div>`:''}
      <label>Program name <input type="text" data-k="name" placeholder="e.g. Yogasanas"></label>
      <div class="row"><label>Dates <input type="text" data-k="dates" placeholder="27-30 Oct"></label>
      <label>Time <input type="text" data-k="time" placeholder="6:30 AM to 9:30 AM"></label></div>`;
    d.querySelectorAll('input').forEach(inp=>{inp.value=p[inp.dataset.k]||'';inp.oninput=()=>{p[inp.dataset.k]=inp.value;save();draw()}});
    const rm=d.querySelector('[data-rm]');if(rm)rm.onclick=()=>{S.progs.splice(i,1);save();buildForm();draw()};
    box.appendChild(d);
  });
  $('addProg').hidden=S.progs.length>=MAXP;
  for(const k of['who','num','venue']){$(k).value=S[k];$(k).oninput=()=>{S[k]=$(k).value;save();draw()}}
  for(const k of['zoom','px','py']){$(k).value=S[k];$(k).oninput=()=>{S[k]=+$(k).value;draw()}}
}
$('addProg').onclick=()=>{if(S.progs.length<MAXP){S.progs.push({name:'',dates:'',time:''});save();buildForm();draw()}};
$('resetContact').onclick=()=>{S.who=DEF.who;S.num=DEF.num;S.venue=DEF.venue;save();buildForm();draw()};
$('resetPhoto').onclick=()=>{S.zoom=100;S.px=50;S.py=50;buildForm();draw()};
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;
  try{photo=await img(URL.createObjectURL(f));S.zoom=100;S.px=50;S.py=50;buildForm();draw()}catch(err){alert('Could not open that photo. Try a JPG or PNG.')}};

/* ---------- drawing ---------- */
function font(px,wt='400',st='normal'){return `${st} ${wt} ${px}px MW, Georgia, serif`}
// Baseline for a CSS line box of the given height, so text lands where the browser layout put it
function base(top,lh,px){ctx.font=ctx.font;const m=ctx.measureText('Hg');
  const a=m.fontBoundingBoxAscent||px*.984,d=m.fontBoundingBoxDescent||px*.273;return top+(lh-(a+d))/2+a}
function natLH(px){const m=ctx.measureText('Hg');return (m.fontBoundingBoxAscent||px*.984)+(m.fontBoundingBoxDescent||px*.273)}
function fitPx(text,px,maxW,minPx,wt,st){ctx.font=font(px,wt,st);while(px>minPx&&ctx.measureText(text).width>maxW){px-=1;ctx.font=font(px,wt,st)}return px}
function shadowOn(){ctx.shadowColor='rgba(40,18,6,.45)';ctx.shadowBlur=14;ctx.shadowOffsetY=2}
function shadowOff(){ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0}

function layoutText(progs){
  // single program uses the approved sizes; more programs step down so the photo keeps its room
  const n=progs.length,sz=[[66,38,0],[54,33,22],[46,30,18]][n-1];
  return {pPx:sz[0],wPx:sz[1],gap:sz[2]};
}

function draw(){
  if(!ready)return;
  ctx.setTransform(1,0,0,1,0,0);ctx.globalCompositeOperation='source-over';shadowOff();
  // background: linear-gradient(160deg,...) + radial glow
  const a=160*Math.PI/180,dx=Math.sin(a),dy=-Math.cos(a),L=Math.abs(W*dx)+Math.abs(H*dy);
  const lg=ctx.createLinearGradient(W/2-dx*L/2,H/2-dy*L/2,W/2+dx*L/2,H/2+dy*L/2);
  lg.addColorStop(0,'#4a2712');lg.addColorStop(.45,'#6a3a17');lg.addColorStop(1,'#8a5220');
  ctx.fillStyle=lg;ctx.fillRect(0,0,W,H);
  ctx.save();const rx=.7*W,ry=.4*H;ctx.translate(.92*W,.26*H);ctx.scale(1,ry/rx);
  const rg=ctx.createRadialGradient(0,0,0,0,0,rx);rg.addColorStop(0,'rgba(214,140,60,.55)');rg.addColorStop(.7,'rgba(214,140,60,0)');
  ctx.fillStyle=rg;ctx.fillRect(-rx*2,-rx*2,rx*4,rx*4);ctx.restore();

  // text layout (measured first so the photo can start below it)
  const progs=S.progs.length?S.progs:[{name:'',dates:'',time:''}];
  const T=layoutText(progs);
  let y=78;const X=96,TW=W-96-80;
  const h1Lines=[y,y+H1*1.08];y+=H1*1.08*2;
  ctx.font=font(44);const whereTop=y+22;y=whereTop+natLH(44);
  const divTop=y+26;y=divTop+40+18;
  const blocks=progs.map((p,i)=>{
    const name=p.name||'Program name';const pPx=fitPx(name,T.pPx,TW,30,'700');
    const top=y+(i?T.gap:0);const lh=T.pPx*1.15;
    const when=[p.dates,p.time].map(s=>(s||'').trim()).filter(Boolean).join(' | ');
    ctx.font=font(T.wPx);const wPx=fitPx(when,T.wPx,TW,20);ctx.font=font(T.wPx);
    const wTop=top+lh+(T.wPx===38?14:8),wLh=natLH(T.wPx);
    y=when?wTop+wLh:top+lh;
    return {name,pPx,top,lh,when,wPx,wTop,wLh,empty:!p.name};
  });
  const textBottom=y;

  // photo: natural colours, cover-fit by default, faded top edge, darkened toward the band
  const top=Math.round(470+Math.max(0,textBottom-558)),ph=BAND-top+40,fade=230;
  const off=document.createElement('canvas');off.width=W;off.height=ph;const o=off.getContext('2d');
  const cover=Math.max(W/photo.naturalWidth,ph/photo.naturalHeight)*S.zoom/100;
  const iw=photo.naturalWidth*cover,ih=photo.naturalHeight*cover;
  const ix=(W-iw)*S.px/100,iy=(ph-ih)*S.py/100;
  o.imageSmoothingQuality='high';o.drawImage(photo,ix,iy,iw,ih);
  const sh=o.createLinearGradient(0,0,0,ph);sh.addColorStop(.55,'rgba(74,39,18,0)');sh.addColorStop(1,'rgba(58,32,16,.9)');
  o.fillStyle=sh;o.fillRect(0,0,W,ph);
  o.globalCompositeOperation='destination-in';
  const mk=o.createLinearGradient(0,0,0,ph);mk.addColorStop(0,'rgba(0,0,0,0)');mk.addColorStop(fade/ph,'#000');mk.addColorStop(1,'#000');
  o.fillStyle=mk;o.fillRect(0,0,W,ph);
  ctx.drawImage(off,0,top);
  drawState.photo={top,ph,iw,ih};

  // headline
  shadowOn();ctx.textBaseline='alphabetic';ctx.textAlign='left';
  ctx.font=font(H1,'700');ctx.fillStyle='#fff7ea';ctx.fillText('Classical',X,base(h1Lines[0],H1*1.08,H1));
  ctx.font=font(H1,'700','italic');ctx.fillStyle='#f6dfa4';
  ctx.fillText(progs.length>1?'Hatha Yoga Programs':'Hatha Yoga Program',X,base(h1Lines[1],H1*1.08,H1));
  ctx.font=font(44);ctx.fillStyle='#fff7ea';ctx.fillText('in Mysuru',X,base(whereTop,natLH(44),44));
  // divider
  ctx.save();ctx.translate(0,divTop);ctx.strokeStyle='#d6a77a';ctx.lineWidth=3.5;ctx.lineCap='round';
  ctx.stroke(new Path2D('M0 22 C60 14 110 14 160 20 C190 24 200 34 230 30 C262 26 262 10 300 12 C340 14 330 30 370 30 C410 30 420 14 460 16 C520 18 560 24 640 22 C680 21 700 22 720 22'));
  ctx.fillStyle='#d6a77a';ctx.beginPath();ctx.arc(736,22,2.5,0,7);ctx.fill();ctx.beginPath();ctx.arc(750,22,2,0,7);ctx.fill();ctx.restore();
  // programs
  for(const b of blocks){
    ctx.font=font(b.pPx,'700');ctx.fillStyle=b.empty?'rgba(246,223,164,.45)':'#f6dfa4';
    ctx.font=font(b.pPx,'700');ctx.fillText(b.name,X,base(b.top,b.lh,b.pPx));
    if(b.when){ctx.font=font(b.wPx);ctx.fillStyle='#d9c6b0';ctx.fillText(b.when,X,base(b.wTop,b.wLh,b.wPx))}
  }
  shadowOff();

  // endorsement tag (unaltered) top right, beside the headline; and photo credit
  ctx.drawImage(tag,W-56-TAGW,TAGTOP,TAGW,TAGW*tag.naturalHeight/tag.naturalWidth);
  ctx.save();ctx.translate(W-22,1080);ctx.rotate(-Math.PI/2);ctx.font='15px sans-serif';
  try{ctx.letterSpacing='0.5px'}catch(e){}
  ctx.fillStyle='rgba(255,255,255,.75)';ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillText('© Isha Foundation',0,9);ctx.restore();
  ctx.textAlign='left';try{ctx.letterSpacing='0px'}catch(e){}

  // registration band
  ctx.fillStyle='#3a2010';ctx.fillRect(0,BAND,W,132);
  ctx.font=font(30,'400','italic');const rLh=natLH(30);
  ctx.font=font(50,'700');const nLh=natLH(50);
  const t0=BAND+(132-(rLh+4+nLh))/2;
  ctx.font=font(30,'400','italic');ctx.fillStyle='#f6dfa4';ctx.textAlign='center';
  ctx.fillText('For registration, contact',W/2,base(t0,rLh,30));ctx.textAlign='left';
  const who=S.who.trim(),num=S.num.trim();
  let px=50,rowW;
  const measure=()=>{ctx.font=font(px,'700');const k=px/50;
    return (who?ctx.measureText(who).width+(22+14+2+22+14)*k:0)+(44*2+14*2)*k+ctx.measureText(num).width};
  while((rowW=measure())>W-120&&px>30)px--;
  const k=px/50,rowTop=t0+rLh+4,mid=rowTop+nLh/2;let x=(W-rowW)/2;
  ctx.font=font(px,'700');ctx.fillStyle='#fff';const nb=mid-natLH(px)/2;
  if(who){ctx.fillText(who,x,base(nb,natLH(px),px));x+=ctx.measureText(who).width+(22+14)*k;
    ctx.fillStyle='rgba(246,223,164,.6)';ctx.fillRect(x,mid-22*k,2,44*k);x+=(2+22+14)*k}
  for(const d of[['M12 2.8a9.2 9.2 0 0 0-7.9 13.9L2.9 21l4.4-1.2A9.2 9.2 0 1 0 12 2.8z','M8.6 7.6c.3-.6.6-.6.9-.6h.6c.2 0 .4.1.5.4l.8 1.9c.1.2 0 .5-.1.6l-.6.7c-.1.2-.1.4 0 .6.7 1.2 1.7 2.1 2.9 2.7.2.1.4.1.6-.1l.7-.8c.2-.2.4-.2.6-.1l1.8.9c.2.1.4.3.3.6-.1.8-.6 1.6-1.4 1.8-1 .3-2.6-.1-4.4-1.5-1.7-1.3-2.9-3-3.2-4.2-.2-1 0-2 .5-2.7z'],
    ['M5 3.5h3.2l1.6 4.2-2.1 1.4a11 11 0 0 0 5.2 5.2l1.4-2.1 4.2 1.6V17a2.5 2.5 0 0 1-2.5 2.5C9.8 19.5 4.5 14.2 4.5 6A2.5 2.5 0 0 1 5 3.5z']]){
    ctx.save();ctx.translate(x,mid-22*k);ctx.scale(44*k/24,44*k/24);ctx.strokeStyle='#fff';ctx.lineWidth=1.6;ctx.lineJoin='round';
    d.forEach(p=>ctx.stroke(new Path2D(p)));ctx.restore();x+=(44+14)*k}
  ctx.fillStyle='#fff';ctx.font=font(px,'700');ctx.fillText(num,x,base(nb,natLH(px),px));

  // venue strip: one line at 31px; shrinks for long names, then wraps to two lines
  ctx.fillStyle='#6b3d1c';ctx.fillRect(0,1504,W,96);
  const lab='VENUE :',ven=S.venue.trim(),maxW=W-80;
  const vw=p=>{ctx.font=font(p,'700');const l=ctx.measureText(lab).width+14;ctx.font=font(p);return [l,ctx.measureText(ven).width]};
  let vp=31,[lw,tw]=vw(vp);while(lw+tw>maxW&&vp>25){vp--;[lw,tw]=vw(vp)}
  if(lw+tw<=maxW){
    let vx=(W-lw-tw)/2;ctx.font=font(vp);const vl=natLH(vp),vb=base(1504+(96-vl)/2,vl,vp);
    ctx.font=font(vp,'700');ctx.fillStyle='#f6dfa4';ctx.fillText(lab,vx,vb);
    ctx.font=font(vp);ctx.fillStyle='#fff';ctx.fillText(ven,vx+lw,vb);
  }else{
    // split the venue at the comma (or space) closest to the middle
    let best=-1,bd=1e9;const mid2=ven.length/2;
    for(let i=0;i<ven.length;i++)if(ven[i]===','||ven[i]===' '){const d2=Math.abs(i-mid2)-(ven[i]===','?6:0);if(d2<bd){bd=d2;best=i}}
    const l1=ven.slice(0,best+(ven[best]===','?1:0)).trim(),l2=ven.slice(best+1).trim();
    vp=28;let ok=false;
    while(!ok&&vp>18){ctx.font=font(vp,'700');lw=ctx.measureText(lab).width+14;ctx.font=font(vp);
      ok=lw+ctx.measureText(l1).width<=maxW&&ctx.measureText(l2).width<=maxW;if(!ok)vp--}
    ctx.font=font(vp);const vl=vp*1.25,t=1504+(96-vl*2)/2;
    let vx=(W-lw-ctx.measureText(l1).width)/2;
    ctx.font=font(vp,'700');ctx.fillStyle='#f6dfa4';ctx.fillText(lab,vx,base(t,vl,vp));
    ctx.font=font(vp);ctx.fillStyle='#fff';ctx.fillText(l1,vx+lw,base(t,vl,vp));
    ctx.textAlign='center';ctx.fillText(l2,W/2,base(t+vl,vl,vp));ctx.textAlign='left';
  }
}
const drawState={};

/* ---------- drag the photo on the preview ---------- */
let drag=null;
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect(),yy=(e.clientY-r.top)*H/r.height;
  const p=drawState.photo;if(!p||yy<p.top||yy>BAND)return;drag={x:e.clientX,y:e.clientY,px:S.px,py:S.py,s:W/r.width};cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing'});
cv.addEventListener('pointermove',e=>{if(!drag)return;const p=drawState.photo;
  const ox=W-p.iw,oy=p.ph-p.ih;
  if(ox)S.px=Math.min(100,Math.max(0,drag.px+(e.clientX-drag.x)*drag.s/ox*100));
  if(oy)S.py=Math.min(100,Math.max(0,drag.py+(e.clientY-drag.y)*drag.s/oy*100));
  $('px').value=S.px;$('py').value=S.py;draw()});
const end=()=>{drag=null;cv.style.cursor='grab'};cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);

/* ---------- export ---------- */
function fname(){const n=(S.progs.map(p=>p.name).filter(Boolean).join('-')||'poster').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  const d=(S.progs[0]?.dates||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');return `${n}${d?'-'+d:''}-poster.png`}
function blob(){return new Promise(ok=>cv.toBlob(ok,'image/png'))}
$('dl').onclick=async()=>{const b=await blob(),u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download=fname();document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)};
try{const t=new File([new Blob(['x'],{type:'image/png'})],'t.png',{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[t]}))$('share').hidden=false}catch(e){}
$('share').onclick=async()=>{const f=new File([await blob()],fname(),{type:'image/png'});
  try{await navigator.share({files:[f]})}catch(e){}};

init().catch(e=>{document.body.insertAdjacentHTML('afterbegin','<p style="padding:16px;color:#b00">Could not start: '+e.message+'</p>')});
</script>
